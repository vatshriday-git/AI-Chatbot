<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Assistant</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;display:flex;justify-content:center}
  .app{width:100%;max-width:640px;height:100dvh;display:flex;flex-direction:column;background:#fff}
  header{padding:14px 18px;background:#4f46e5;color:#fff;font-weight:600}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap}
  .user{align-self:flex-end;background:#4f46e5;color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:#eef0f4;color:#111;border-bottom-left-radius:4px}
  .fb{margin-top:6px;font-size:14px}
  .fb button{border:0;background:none;cursor:pointer;font-size:16px;opacity:.6}
  .fb button:hover{opacity:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid #4f46e5;color:#4f46e5;background:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid #e5e7eb}
  input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
  button.send{padding:0 18px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:16px;cursor:pointer}
  .typing{opacity:.6;font-style:italic}
</style>
</head>
<body>
<div class="app">
  <header>🤖 Support Assistant</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Type your question…" autocomplete="off" maxlength="1000" required>
    <button class="send" type="submit">Send</button>
  </form>
</div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let sessionId = localStorage.getItem("session_id");

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;           // textContent prevents XSS
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addFeedback(div, messageId) {
  const fb = document.createElement("div");
  fb.className = "fb";
  [["👍", true], ["👎", false]].forEach(([icon, val]) => {
    const b = document.createElement("button");
    b.textContent = icon;
    b.onclick = async () => {
      await fetch("/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message_id: messageId, helpful: val})});
      fb.textContent = "Thanks for your feedback!";
    };
    fb.appendChild(b);
  });
  div.appendChild(fb);
}

function addChips(div, suggestions) {
  if (!suggestions.length) return;
  const wrap = document.createElement("div");
  wrap.className = "chips";
  suggestions.forEach(s => {
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.textContent = s;
    c.onclick = () => send(s);
    wrap.appendChild(c);
  });
  div.appendChild(wrap);
}

async function send(text) {
  addMsg("user", text);
  const typing = addMsg("bot typing", "Typing…");
  try {
    const res = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sessionId, message: text})});
    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    sessionId = data.session_id;
    localStorage.setItem("session_id", sessionId);
    typing.remove();
    const div = addMsg("bot", data.reply);
    addChips(div, data.suggestions);
    addFeedback(div, data.message_id);
  } catch (e) {
    typing.remove();
    addMsg("bot", "Sorry, something went wrong. Please try again.");
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});

(async function init() {
  if (sessionId) {
    try {
      const res = await fetch("/api/history/" + encodeURIComponent(sessionId));
      const hist = await res.json();
      hist.forEach(m => addMsg(m.role, m.text));
    } catch (e) {}
  }
  if (!chat.children.length) addMsg("bot", "Hi! 👋 How can I help you today?");
})();
</script>
</body>
</html>
